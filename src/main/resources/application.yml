spring:
    profiles:
      active: local              # application-local.yml도 같이 읽기

    server:
      servlet:
        encoding:
          charset: UTF-8
          force: true

    datasource:
      url: jdbc:mysql://localhost:3306/ichibang
      username: root

    jpa:
      hibernate:
        ddl-auto: validate
      show-sql: true
      properties:
        hibernate:
          format_sql: true