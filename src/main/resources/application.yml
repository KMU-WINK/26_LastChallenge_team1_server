app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5174}

spring:
  profiles:
    active: local              # application-local.yml도 같이 읽기

  datasource:
    url: jdbc:mysql://localhost:3306/ichibang
    username: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true